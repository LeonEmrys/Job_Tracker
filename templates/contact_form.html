{% extends "base.html" %}
{% block title %}{{ action }} Contact{% endblock %}
{% block content %}
<h1>{{ action }} Contact</h1>
<form method="post" class="bg-white p-4 border rounded">
  <div class="mb-3">
    <label class="form-label">Company *</label>
    <select class="form-select" name="company_id" required>
      <option value="">-- Choose a company --</option>
      {% for co in companies %}
      <option value="{{ co.company_id }}"
        {% if (contact.company_id | string) == (co.company_id | string) %}selected{% endif %}>
        {{ co.company_name }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Contact Name *</label>
    <input class="form-control" name="contact_name" value="{{ contact.contact_name or '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Title</label>
    <input class="form-control" name="title" value="{{ contact.title or '' }}">
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Email</label>
      <input class="form-control" name="email" value="{{ contact.email or '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Phone</label>
      <input class="form-control" name="phone" value="{{ contact.phone or '' }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">LinkedIn URL</label>
    <input class="form-control" name="linkedin_url" value="{{ contact.linkedin_url or '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Notes</label>
    <textarea class="form-control" name="notes" rows="3">{{ contact.notes or '' }}</textarea>
  </div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-secondary" href="{{ url_for('contacts') }}">Cancel</a>
</form>
{% endblock %}
