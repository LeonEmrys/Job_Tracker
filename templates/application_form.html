{% extends "base.html" %}
{% block title %}{{ action }} Application{% endblock %}
{% block content %}
<h1>{{ action }} Application</h1>
<form method="post" class="bg-white p-4 border rounded">
  <div class="mb-3">
    <label class="form-label">Job *</label>
    <select class="form-select" name="job_id" required>
      <option value="">-- Choose a job --</option>
      {% for j in jobs %}
      <option value="{{ j.job_id }}"
        {% if (application.job_id | string) == (j.job_id | string) %}selected{% endif %}>
        {{ j.job_title }} - {{ j.company_name or 'No company' }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Application Date *</label>
      <input class="form-control" type="date" name="application_date" value="{{ application.application_date or '' }}" required>
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Status *</label>
      <select class="form-select" name="status" required>
        <option value="">-- Choose a status --</option>
        {% for s in statuses %}
        <option value="{{ s }}" {% if application.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Resume Version</label>
    <input class="form-control" name="resume_version" value="{{ application.resume_version or '' }}" placeholder="v1">
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="cover_letter_sent" value="1" id="cl"
      {% if application.cover_letter_sent %}checked{% endif %}>
    <label class="form-check-label" for="cl">Cover letter sent</label>
  </div>
  <h5 class="mt-4">Interview Details (optional)</h5>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">Round</label>
      <input class="form-control" type="number" min="1" name="interview_round" value="{{ interview.round or '' }}">
    </div>
    <div class="col-md-8 mb-3">
      <label class="form-label">Date</label>
      <input class="form-control" type="date" name="interview_date" value="{{ interview.date or '' }}">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Interview Notes</label>
    <textarea class="form-control" name="interview_notes" rows="3">{{ interview.notes or '' }}</textarea>
  </div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-secondary" href="{{ url_for('applications') }}">Cancel</a>
</form>
{% endblock %}
